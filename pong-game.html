<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 800px;
            margin: 0 auto 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 1.5em;
        }

        .score {
            flex: 1;
        }

        .score-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .score-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff00;
        }

        canvas {
            display: block;
            background: #000;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            margin: 0 auto;
        }

        .controls {
            color: #fff;
            margin-top: 20px;
            font-size: 0.95em;
        }

        .controls p {
            margin: 8px 0;
            opacity: 0.9;
        }

        .reset-btn {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 1em;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #00dd00;
            transform: scale(1.05);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        
        <div class="scoreboard">
            <div class="score">
                <div class="score-label">PLAYER</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score">
                <div class="score-label">COMPUTER</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <p><strong>🕹️ Controls:</strong></p>
            <p>🖱️ Mouse: Move left paddle vertically</p>
            <p>⬆️⬇️ Arrow Keys: Also control left paddle</p>
            <p>🤖 Right paddle: Computer AI</p>
            <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;
        const ballSpeed = 5;
        const paddleSpeed = 6;

        let playerScore = 0;
        let computerScore = 0;

        // Player paddle (left)
        const player = {
            x: 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0
        };

        // Computer paddle (right)
        const computer = {
            x: canvas.width - paddleWidth - 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0
        };

        // Ball
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: ballSpeed,
            dy: ballSpeed,
            radius: ballSize
        };

        // Keyboard state
        const keys = {
            ArrowUp: false,
            ArrowDown: false
        };

        // Event listeners for keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                keys.ArrowUp = true;
            }
            if (e.key === 'ArrowDown') {
                keys.ArrowDown = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') {
                keys.ArrowUp = false;
            }
            if (e.key === 'ArrowDown') {
                keys.ArrowDown = false;
            }
        });

        // Event listener for mouse movement
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            
            // Smoothly move paddle to mouse position
            const paddleCenter = player.y + paddleHeight / 2;
            const distance = mouseY - paddleCenter;
            
            if (Math.abs(distance) > 5) {
                player.dy = distance > 0 ? paddleSpeed : -paddleSpeed;
            } else {
                player.dy = 0;
            }
        });

        // Draw functions
        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawCircle(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCenter() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            // Clear canvas
            drawRect(0, 0, canvas.width, canvas.height, '#000');

            // Draw center line
            drawCenter();

            // Draw paddles
            drawRect(player.x, player.y, player.width, player.height, '#00ff00');
            drawRect(computer.x, computer.y, computer.width, computer.height, '#ff00ff');

            // Draw ball
            drawCircle(ball.x, ball.y, ball.radius, '#fff');
        }

        function updatePlayer() {
            // Arrow key control
            if (keys.ArrowUp) {
                player.y -= paddleSpeed;
            }
            if (keys.ArrowDown) {
                player.y += paddleSpeed;
            }

            // Also apply mouse movement
            player.y += player.dy;

            // Boundary collision for player paddle
            if (player.y < 0) {
                player.y = 0;
            }
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateComputer() {
            // Simple AI: follow the ball
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;

            if (ballCenter < computerCenter - 35) {
                computer.y -= paddleSpeed * 0.85;
            } else if (ballCenter > computerCenter + 35) {
                computer.y += paddleSpeed * 0.85;
            }

            // Boundary collision for computer paddle
            if (computer.y < 0) {
                computer.y = 0;
            }
            if (computer.y + computer.height > canvas.height) {
                computer.y = canvas.height - computer.height;
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top and bottom wall collision
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
                ball.y = ball.y - ball.radius < 0 ? ball.radius : canvas.height - ball.radius;
            }

            // Left paddle collision
            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx = -ball.dx;
                ball.x = player.x + player.width + ball.radius;

                // Add spin based on where ball hits paddle
                const collidePoint = ball.y - (player.y + player.height / 2);
                ball.dy = (collidePoint / (player.height / 2)) * ballSpeed;
            }

            // Right paddle collision
            if (
                ball.x + ball.radius > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height
            ) {
                ball.dx = -ball.dx;
                ball.x = computer.x - ball.radius;

                // Add spin based on where ball hits paddle
                const collidePoint = ball.y - (computer.y + computer.height / 2);
                ball.dy = (collidePoint / (computer.height / 2)) * ballSpeed;
            }

            // Left wall (computer scores)
            if (ball.x - ball.radius < 0) {
                computerScore++;
                document.getElementById('computerScore').textContent = computerScore;
                resetBall();
            }

            // Right wall (player scores)
            if (ball.x + ball.radius > canvas.width) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ballSpeed;
            ball.dy = (Math.random() * 2 - 1) * ballSpeed;
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
            resetBall();
        }

        function update() {
            updatePlayer();
            updateComputer();
            updateBall();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
